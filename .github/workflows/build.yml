name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and build APK
        run: |
          set -e
          flutter --version
          echo "Repository contents:"
          find . -maxdepth 3 -type f | grep -v '^\./\.git'

          MAIN_DART=$(find . -iname 'main.dart' -print -quit)
          PUBSPEC=$(find . -iname 'pubspec.yaml' -print -quit)

          if [ -z "$MAIN_DART" ]; then
            echo "ERROR: could not find main.dart anywhere in the repository."
            exit 1
          fi
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: could not find pubspec.yaml anywhere in the repository."
            exit 1
          fi
          echo "Using main.dart at: $MAIN_DART"
          echo "Using pubspec.yaml at: $PUBSPEC"

          flutter create --org com.marathivoice --project-name marathi_voice --platforms=android app_build
          rm -rf app_build/lib
          mkdir app_build/lib
          cp "$MAIN_DART" app_build/lib/main.dart
          cp "$PUBSPEC" app_build/pubspec.yaml
          cd app_build
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' "$M"
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk(Version)?( *=)? *flutter\.minSdkVersion/minSdk = 24/' "$f"
            fi
          done
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: marathi-voice-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
